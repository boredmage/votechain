      try {
        var t = localStorage.getItem("votechain.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.className = t;
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
