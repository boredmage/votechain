# Serves the Vite build and forwards /api to the backend service (docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # EC8A form scans go through /api/ipfs/upload (MAX_UPLOAD_BYTES is 15 MB by default)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the backend through Docker's DNS on every request, so nginx keeps working when the
    # backend container is rebuilt or restarted and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # hashed bundles: cache for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
