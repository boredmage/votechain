[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
gas_limit = "18446744073709551615"   # unlimited: the full Oyo State benchmark needs > 2^30 gas in one test
gas_reports = ["ElectionManager", "ResultUpload", "PartyAgentVerification", "CollationEngine", "AuditDeclaration"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./benchmarks" },
  { access = "read", path = "./script" }
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[lint]
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]

[profile.ci]
verbosity = 3

# RPC endpoints used by `forge script --rpc-url <alias>`
[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
